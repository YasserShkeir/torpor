<?xml version="1.0" encoding="UTF-8"?>
<!--
  Torpor app icon — vector source of truth.

  An eleven-spoke radial burst in a warm coral palette, so Torpor reads as part
  of the Claude tooling family. Spoke lengths alternate long/short, which gives
  the mark life; an earlier version dimmed three adjacent spokes to suggest
  sleeping sessions and was rejected because it read as damage.

  Deliberately evocative of Claude's mark rather than a copy — Anthropic
  polices its trademarks and this app is not affiliated with them.

  scripts/make-icon.swift redraws this with CoreGraphics to produce
  AppIcon.icns. Geometry constants are shared; keep the two in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E07E5A"/>
      <stop offset="1" stop-color="#C25D3B"/>
    </linearGradient>
    <!-- One petal, drawn along +x from the hub; instances are rotated below.
         outerRadius 288, short spokes 74% of that, hub half-width 44. -->
    <path id="long"  d="M58,-44 Q173,-27 288,-11 A11,11 0 0 1 288,11 Q173,27 58,44 Z"/>
    <path id="short" d="M58,-44 Q135,-27 213,-11 A11,11 0 0 1 213,11 Q135,27 58,44 Z"/>
  </defs>

  <rect x="92" y="92" width="840" height="840" rx="189" ry="189" fill="url(#plate)"/>

  <g fill="#FFFBF8" transform="translate(512 512) rotate(-90)">
    <use href="#long"  transform="rotate(0)"/>
    <use href="#short" transform="rotate(32.727)"/>
    <use href="#long"  transform="rotate(65.455)"/>
    <use href="#short" transform="rotate(98.182)"/>
    <use href="#long"  transform="rotate(130.909)"/>
    <use href="#short" transform="rotate(163.636)"/>
    <use href="#long"  transform="rotate(196.364)"/>
    <use href="#short" transform="rotate(229.091)"/>
    <use href="#long"  transform="rotate(261.818)"/>
    <use href="#short" transform="rotate(294.545)"/>
    <use href="#long"  transform="rotate(327.273)"/>
    <circle cx="0" cy="0" r="68"/>
  </g>
</svg>
