name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          # `swift build --arch` routes through Xcode's build system, which
          # rejects swiftLanguageMode on older toolchains — the default Xcode on
          # a runner image is not always the newest installed.
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          swift --version

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build (debug)
        # -warnings-as-errors, not a grep over the log: with .build restored
        # from cache Swift emits no diagnostics for modules it did not
        # recompile, so a log grep passed unconditionally on every cache hit.
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        # Same flags as the build above, so the test sources go through the
        # warning gate too and the compile is reused rather than redone. Placed
        # before the bundle step so a logic regression is reported without
        # waiting on the universal-binary link.
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build the app bundle
        run: ./scripts/build-app.sh

      - name: Smoke-test the CLI
        run: |
          BIN="dist/Torpor.app/Contents/MacOS/Torpor"
          "$BIN" --version
          "$BIN" --help > /dev/null
          # No Claude Code on the runner, so this must exit cleanly saying so.
          "$BIN" --list
          # An unknown flag must be rejected, not silently launch the GUI.
          if "$BIN" --definitely-not-a-flag 2>/dev/null; then
            echo "::error::Unknown flag did not exit non-zero"
            exit 1
          fi
