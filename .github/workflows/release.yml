name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from the tag
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          PLIST=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)
          # The tag and Info.plist must agree, or Sparkle offers an update that
          # reports the old version once installed and offers itself forever.
          if [ "$V" != "$PLIST" ]; then
            echo "::error::tag $TAG says $V but Info.plist says $PLIST"
            exit 1
          fi
          # Sparkle compares CFBundleVersion, not the short string, against
          # sparkle:version, so a plist that only bumps the short string ships a
          # build that is never offered an update.
          if [ "$V" != "$BUILD" ]; then
            echo "::error::tag $TAG says $V but CFBundleVersion is $BUILD"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"

      - name: Select the newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          swift --version

      # Absent secrets mean an ad-hoc build rather than a failed release, so a
      # tag still ships while the certificate is being sorted out. What it must
      # never do is claim to be notarised when it isn't, which is why the
      # packaged-app check below asserts on whatever this step decided.
      - name: Import the signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "::warning::APPLE_CERT_P12 is not set — this release will be ad-hoc signed and NOT notarised"
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPASS=$(uuidgen)
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12 >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign blocks on a GUI prompt that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" \
               | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          [ -n "$ID" ] || { echo "::error::the imported certificate has no Developer ID Application identity"; exit 1; }
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "signing as: $ID"

      # SKIP_NOTARIZATION exists for one situation: Apple holds an account's
      # first submission for in-depth analysis, and every later submission from
      # that account queues behind it. While that lasts, notarising in CI does
      # not fail — it hangs, on a runner billed at 10x. Setting the repository
      # variable to 'true' ships signed-but-unnotarised rather than not at all.
      # Unset it the moment the hold clears; the check below makes sure a
      # release cannot quietly claim to be notarised while it is set.
      - name: Build
        id: build
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          SKIP_NOTARIZATION: ${{ vars.SKIP_NOTARIZATION }}
        run: |
          set -euo pipefail
          NOTARISED=false
          if [ "${SKIP_NOTARIZATION:-}" = "true" ]; then
            echo "::warning::SKIP_NOTARIZATION is set — shipping signed but NOT notarised. Users will see Gatekeeper's malware warning on first open."
          elif [ -n "${IDENTITY:-}" ] && [ -n "${NOTARY_KEY_P8:-}" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac.p8"
            export NOTARY_KEY_PATH="$RUNNER_TEMP/ac.p8"
            NOTARISED=true
          elif [ -n "${IDENTITY:-}" ]; then
            echo "::warning::signed but APPLE_API_KEY_P8 is not set — not notarised"
          fi
          echo "notarised=$NOTARISED" >> "$GITHUB_OUTPUT"
          trap 'rm -f "$RUNNER_TEMP/ac.p8"' EXIT
          ./scripts/build-app.sh

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          # ditto, never `zip -r`: zip dereferences the symlinks inside
          # Sparkle.framework and produces a bundle whose signature can never
          # verify — indistinguishable from a Gatekeeper problem, and unfixable
          # by the user.
          ditto -c -k --sequesterRsrc --keepParent dist/Torpor.app "dist/Torpor-$V.zip"
          ( cd dist && shasum -a 256 "Torpor-$V.zip" > "Torpor-$V.zip.sha256" )
          echo "zip=dist/Torpor-$V.zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 < "dist/Torpor-$V.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Verify the packaged app
        env:
          V: ${{ steps.v.outputs.version }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARISED: ${{ steps.build.outputs.notarised }}
        run: |
          set -euo pipefail
          # Verify the copy that ships, not the one on disk: ditto is what
          # rewrote the bundle, and nothing else in this pipeline opens the zip
          # again before a user does.
          rm -rf verify && mkdir verify
          ditto -x -k "dist/Torpor-$V.zip" verify
          codesign --verify --deep --strict verify/Torpor.app
          for key in CFBundleShortVersionString CFBundleVersion; do
            GOT=$(/usr/libexec/PlistBuddy -c "Print :$key" verify/Torpor.app/Contents/Info.plist)
            if [ "$GOT" != "$V" ]; then
              echo "::error::packaged $key is $GOT, expected $V"
              exit 1
            fi
          done
          # An app that cannot print its own version is not worth signing an
          # appcast for.
          verify/Torpor.app/Contents/MacOS/Torpor --version

          # Gatekeeper's own verdict on the copy that ships. `codesign --verify`
          # above only says the signature is internally consistent; an ad-hoc
          # build passes it and is still refused on every machine but this one.
          if [ -n "$SIGNING_IDENTITY" ]; then
            # Inverted, to match scripts/build-app.sh. This used to assert the
            # apple-events entitlement was PRESENT, back when revive drove
            # Terminal over Apple events. Nothing sends an Apple event any more,
            # restoring a session is a command the user pastes, and the
            # entitlement is gone — so the check now guards its absence.
            # Shipping it again would let macOS ask a user for Automation
            # permission Torpor has no use for.
            if codesign -d --entitlements - --xml verify/Torpor.app 2>/dev/null \
                 | grep -q apple-events; then
              echo "::error::packaged app carries the apple-events entitlement — Torpor requests no entitlements"
              exit 1
            fi
          fi
          if [ "${NOTARISED:-false}" = "true" ]; then
            xcrun stapler validate verify/Torpor.app
            spctl --assess --type execute --verbose=2 verify/Torpor.app
            echo "notarised, stapled, and accepted by Gatekeeper"
          elif [ -n "$SIGNING_IDENTITY" ]; then
            # Assert the negative too, so "unnotarised" is a recorded fact in the
            # log rather than an absence someone has to notice.
            if xcrun stapler validate verify/Torpor.app >/dev/null 2>&1; then
              echo "::error::a ticket is stapled but this build did not notarise — refusing to guess what shipped"
              exit 1
            fi
            echo "::warning::signed as $SIGNING_IDENTITY but NOT notarised — first open shows Gatekeeper's warning"
          else
            echo "::warning::ad-hoc build — users must clear the quarantine flag by hand"
          fi

      # Not notarisation and not a Gatekeeper substitute, but real supply-chain
      # evidence: anyone can verify this exact file came out of this workflow.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.zip }}

      - name: Create the release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Draft until the appcast has landed. Publishing first means a failed
          # appcast push leaves a public release that no installed copy is ever
          # offered — the same reasoning that already puts the cask bump last.
          gh release create "$TAG" \
            "dist/Torpor-$V.zip" "dist/Torpor-$V.zip.sha256" \
            --title "Torpor $V" --generate-notes --draft

      - name: Sign the archive and publish the appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          [ -n "${SPARKLE_ED_KEY:-}" ] || { echo "::error::SPARKLE_ED_KEY is not set — the appcast cannot be signed"; exit 1; }
          echo "::add-mask::$SPARKLE_ED_KEY"
          SIGN=$(find .build/artifacts -name sign_update -type f -not -path "*old_dsa*" | head -1)
          # An empty result would run the empty string and report "command not
          # found", which reads as a broken runner rather than a missing tool.
          [ -x "$SIGN" ] || { echo "::error::Sparkle's sign_update not found — did the build resolve Sparkle?"; exit 1; }
          # --ed-key-file - reads from stdin, so the key never lands in argv
          # or on disk.
          SIG=$(printf '%s' "$SPARKLE_ED_KEY" | "$SIGN" "dist/Torpor-$V.zip" --ed-key-file -)
          # The signing key and the key baked into the app are the entire trust
          # anchor. If they have drifted, every user's update fails signature
          # validation at install time, after the download — check it here,
          # where it is a red workflow instead.
          cat > "$RUNNER_TEMP/ed-public-key.swift" <<'SWIFT'
          import CryptoKit
          import Foundation
          guard let key = Data(base64Encoded: readLine(strippingNewline: true) ?? "") else {
              fputs("SPARKLE_ED_KEY is not base64\n", stderr)
              exit(1)
          }
          // Older Sparkle keys are seed+public; newer ones are the 32-byte seed.
          print(try! Curve25519.Signing.PrivateKey(rawRepresentation: Data(key.prefix(32)))
                  .publicKey.rawRepresentation.base64EncodedString())
          SWIFT
          DERIVED=$(printf '%s\n' "$SPARKLE_ED_KEY" | swift "$RUNNER_TEMP/ed-public-key.swift")
          BAKED=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" verify/Torpor.app/Contents/Info.plist)
          if [ "$DERIVED" != "$BAKED" ]; then
            echo "::error::SPARKLE_ED_KEY does not match SUPublicEDKey in the packaged app"
            exit 1
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/Torpor-$V.zip"

          # This job is checked out at a tag; the appcast has to land on the
          # branch GitHub Pages serves. Not shallow — a rebase below needs a
          # merge base.
          git clone --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main-checkout
          ./scripts/appcast-insert.py "$V" "$TAG" "$URL" "$SIG" main-checkout/docs/appcast.xml
          cd main-checkout
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "appcast: $V"
          # Any push to main between the clone and here loses the race, and the
          # feed is the only thing that makes a release reachable — rebase onto
          # whatever landed and try again.
          pushed=""
          for _ in 1 2 3; do
            if git push; then pushed=1; break; fi
            git pull --rebase origin main
          done
          [ -n "$pushed" ] || { echo "::error::could not push the appcast — re-run this job"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      # Last, so nobody can tap a cask whose download 404s.
      - name: Bump the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          V: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "TAP_TOKEN not set — skipping"; exit 0; fi
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/YasserShkeir/homebrew-torpor.git" tap
          cd tap
          /usr/bin/sed -i '' -E "s|^  version \"[^\"]*\"|  version \"${V}\"|" Casks/torpor.rb
          /usr/bin/sed -i '' -E "s|^  sha256 \"[^\"]*\"|  sha256 \"${SHA}\"|"  Casks/torpor.rb
          if git diff --quiet; then echo "::error::cask unchanged — sed matched nothing"; exit 1; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "torpor ${V}"
          git push
